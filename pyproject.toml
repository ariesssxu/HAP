[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-coevolution"
version = "0.4.0"
description = "A controlled environment and harness co-evolution research scaffold"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Manjie Xu"}]
dependencies = []

[project.optional-dependencies]
minigrid = ["minigrid>=3.0,<4"]
alfworld = ["alfworld>=0.4,<1", "pyyaml>=6"]

[project.scripts]
rsi = "rsi.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]
